<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f8f7f0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="OverDeath" />
  <meta name="description" content="死に戻るたびに強くなる、一人称視点の洞窟RPGプロトタイプ。" />
  <title>OverDeath Dungeon prototype v0</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/app-icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/app-icon.svg" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="enemy-fix.css" />
</head>
<body>
  <main class="phone-shell">
    <section id="titleScreen" class="screen screen-title">
      <p class="kicker">prototype / v0</p>
      <h1>OverDeath<br>Dungeon</h1>
      <p class="subtitle">死を越える洞窟</p>
      <button id="startButton" class="primary-button">洞窟に入る</button>
      <button id="loadButton" class="ghost-button">セーブから再開</button>
    </section>

    <section id="storyScreen" class="screen screen-story hidden">
      <div class="story-card">
        <div id="storyVisual" class="story-visual hero neutral" aria-label="主人公"></div>
        <p id="storyText"></p>
      </div>
      <button id="nextStoryButton" class="primary-button">次へ</button>
    </section>

    <section id="gameScreen" class="screen screen-game hidden">
      <header class="hud-top">
        <div class="name-block">
          <span class="hand-label">主人公</span>
          <div class="hp-shell" aria-label="HP">
            <div id="hpBar" class="hp-bar"></div>
          </div>
        </div>
        <div class="minimap-wrap" aria-label="ミニマップ">
          <canvas id="miniMap" width="96" height="96"></canvas>
        </div>
      </header>

      <section class="dungeon-view" aria-label="ダンジョン表示">
        <canvas id="viewCanvas" width="360" height="260"></canvas>
        <div id="viewSprite" class="view-sprite hidden"></div>
      </section>

      <section class="bottom-panels">
        <aside class="status-panel">
          <div id="heroPortrait" class="portrait hero neutral" aria-label="主人公の表情"></div>
          <div class="stats">
            <p>HP <strong id="hpText">34/34</strong></p>
            <p>攻撃 <strong id="attackText">5</strong></p>
            <p>レベル <strong id="levelText">1</strong></p>
            <p>薬 <strong id="potionText">0</strong></p>
            <p>死亡 <strong id="deathText">0</strong></p>
            <p>読込 <strong id="loadText">0</strong></p>
          </div>
        </aside>
        <section class="log-panel" aria-live="polite">
          <p id="messageText">閉じ込められた。先に進まないと……。</p>
        </section>
      </section>

      <nav class="controls" aria-label="操作">
        <button id="turnLeftButton">左を向く</button>
        <button id="forwardButton" class="primary-button">前進</button>
        <button id="turnRightButton">右を向く</button>
      </nav>

      <nav class="menu-row" aria-label="メニュー">
        <button id="itemMenuButton" class="ghost-button">アイテム</button>
        <button id="statusButton" class="ghost-button">ステータス</button>
      </nav>

      <footer class="save-row">
        <button id="manualSaveButton" class="ghost-button">保存</button>
        <button id="manualLoadButton" class="ghost-button">読込</button>
        <button id="resetButton" class="danger-button">初期化</button>
      </footer>
    </section>
  </main>

  <section id="deathOverlay" class="death-overlay hidden" aria-live="assertive">
    <div class="death-box">
      <p id="deathOverlayText"></p>
      <button id="deathNextButton" class="primary-button">タップして進む</button>
    </div>
  </section>

  <section id="menuOverlay" class="menu-overlay hidden" aria-live="polite">
    <div class="menu-box">
      <h2 id="menuTitle">メニュー</h2>
      <p id="menuText"></p>
      <div id="menuActions" class="menu-actions"></div>
      <button id="closeMenuButton" class="ghost-button">閉じる</button>
    </div>
  </section>

  <script src="game.js"></script>
  <script src="patch.js"></script>
  <script src="combat.js"></script>
  <script src="render-fix.js"></script>
  <script src="effects.js"></script>
  <script>
    document.getElementById('resetButton')?.addEventListener('click', () => {
      localStorage.removeItem('overdeath-dungeon-prototype-v0');
      localStorage.removeItem('overdeath-dungeon-prototype-v0:auto');
      localStorage.removeItem('overdeath-dungeon-prototype-v0:manual');
    }, true);

    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(error => {
          console.warn('Service worker registration failed:', error);
        });
      });
    }
  </script>
</body>
</html>
