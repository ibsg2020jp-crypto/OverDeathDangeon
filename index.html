<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f8f7f0" />
  <title>OverDeath Dungeon prototype v1 clean</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <section id="titleScreen" class="screen title-screen">
      <p class="kicker">prototype / v1 clean</p>
      <h1>OverDeath<br>Dungeon</h1>
      <p class="subtitle">死を越える洞窟</p>
      <button id="newGameBtn" class="primary">はじめから</button>
      <button id="continueBtn">セーブから再開</button>
    </section>

    <section id="storyScreen" class="screen hidden">
      <div class="story-card">
        <div id="storyFace" class="face neutral" aria-label="主人公"></div>
        <p id="storyText"></p>
      </div>
      <button id="storyNextBtn" class="primary">次へ</button>
    </section>

    <section id="gameScreen" class="screen game-screen hidden">
      <header class="top-hud">
        <div class="hero-title">
          <strong>主人公</strong>
          <div class="hp-frame"><div id="hpBar" class="hp-bar"></div></div>
        </div>
        <canvas id="miniMap" width="96" height="96" aria-label="ミニマップ"></canvas>
      </header>

      <section class="view-wrap">
        <canvas id="viewCanvas" width="360" height="260" aria-label="一人称ダンジョン"></canvas>
        <div id="viewObject" class="view-object hidden"></div>
      </section>

      <section class="lower">
        <aside class="portrait-card">
          <div id="heroFace" class="face small neutral" aria-label="主人公の表情"></div>
          <div class="quick-stats">
            <p>HP <b id="hpText">34/34</b></p>
            <p>攻撃 <b id="atkText">5</b></p>
            <p>Lv <b id="lvText">1</b></p>
            <p>薬 <b id="potionText">0</b></p>
          </div>
        </aside>
        <section class="log-card" aria-live="polite">
          <p id="logText">閉じ込められた。先に進まないと……。</p>
        </section>
      </section>

      <nav class="move-row" aria-label="移動">
        <button id="leftBtn">左を向く</button>
        <button id="forwardBtn" class="primary">前進</button>
        <button id="rightBtn">右を向く</button>
      </nav>

      <nav class="menu-row" aria-label="メニュー">
        <button id="itemBtn">アイテム</button>
        <button id="statusBtn">ステータス</button>
      </nav>

      <footer class="save-row">
        <button id="saveBtn">保存</button>
        <button id="loadBtn">読込</button>
        <button id="resetBtn" class="danger">初期化</button>
      </footer>
    </section>
  </main>

  <section id="overlay" class="overlay hidden" aria-live="assertive">
    <div class="modal">
      <h2 id="overlayTitle"></h2>
      <p id="overlayText"></p>
      <div id="overlayActions" class="modal-actions"></div>
      <button id="overlayCloseBtn">閉じる</button>
    </div>
  </section>

  <script src="game.js"></script>
</body>
</html>
